name: WhatsApp refactor tests

on:
  pull_request:
    paths:
      - "index.js"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/whatsapp-refactor-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  generate-logging-extraction:
    if: github.head_ref == 'tmp/logging-extraction'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/logging-extraction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Move logger without changing behavior
        run: |
          mkdir -p src/whatsapp/logging
          cp src/baileysRawLogger.js src/whatsapp/logging/baileysLogger.js
          python - <<'PY'
          from pathlib import Path

          logger = Path('src/whatsapp/logging/baileysLogger.js')
          source = logger.read_text()
          old = 'import { writeSystemLog } from "./systemLog.js";'
          new = 'import { writeSystemLog } from "../../systemLog.js";'
          assert source.count(old) == 1
          logger.write_text(source.replace(old, new))

          whatsapp = Path('src/whatsapp.js')
          source = whatsapp.read_text()
          old = 'import { createBaileysRawLogger } from "./baileysRawLogger.js";'
          new = 'import { createBaileysRawLogger } from "./whatsapp/logging/baileysLogger.js";'
          assert source.count(old) == 1
          whatsapp.write_text(source.replace(old, new))
          PY
          cat > src/baileysRawLogger.js <<'EOF'
          export {
            createBaileysRawLogger,
            sanitizeBaileysLogText,
          } from "./whatsapp/logging/baileysLogger.js";
          EOF
      - name: Archive canonicalization proof gate
        run: |
          cat > test/whatsappPatchBoundary.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import fs from "node:fs/promises";
          import path from "node:path";

          import { materializeCurrentPatchedWhatsapp } from "./helpers/materializePatchedWhatsapp.js";

          const CANONICALIZATION_PROOF_SHA256 =
            "e639e4806d2e7ff291f8ddccf2246e06922d176ebe095a31a377e1099ef05480";

          test("archived patch chain still reproduces the canonicalization proof source", async (t) => {
            const materialized = await materializeCurrentPatchedWhatsapp();
            t.after(materialized.cleanup);

            const digest = createHash("sha256")
              .update(materialized.source, "utf8")
              .digest("hex");

            assert.equal(digest, CANONICALIZATION_PROOF_SHA256);
          });

          test("index.js no longer imports or executes runtime WhatsApp source patches", async () => {
            const indexSource = await fs.readFile(
              path.join(process.cwd(), "index.js"),
              "utf8"
            );

            assert.doesNotMatch(indexSource, /apply(?:Whatsapp|Baileys)\w+/);
            assert.match(indexSource, /import\("\.\/src\/whatsapp\.js"\)/);
          });
          EOF
      - name: Include extracted logger in syntax check
        run: |
          python - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          source = package.read_text()
          old = 'node --check src/baileysRawLogger.js"'
          new = 'node --check src/baileysRawLogger.js && node --check src/whatsapp/logging/baileysLogger.js"'
          assert source.count(old) == 1
          package.write_text(source.replace(old, new))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Create logging extraction commit
        run: |
          git config user.name "TravelsPlatform"
          git config user.email "152078198+tp-management@users.noreply.github.com"
          git add src/baileysRawLogger.js src/whatsapp/logging/baileysLogger.js src/whatsapp.js test/whatsappPatchBoundary.test.js package.json
          git diff --cached --check
          git commit -m "refactor: extract Baileys logger module"
          git push --force origin HEAD:refs/heads/generated/whatsapp-logging-extraction
