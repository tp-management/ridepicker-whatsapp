name: PR34 safety gate

on:
  push:
    branches:
      - fix/observability-sse-abort

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:stateless
      - run: npm run check
