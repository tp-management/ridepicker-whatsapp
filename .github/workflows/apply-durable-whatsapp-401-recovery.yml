name: Apply durable WhatsApp 401 recovery

on:
  push:
    branches:
      - fix/durable-whatsapp-401-recovery
    paths:
      - scripts/apply-durable-whatsapp-401-recovery.mjs
      - .github/workflows/apply-durable-whatsapp-401-recovery.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/durable-whatsapp-401-recovery
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded source patch
        run: node scripts/apply-durable-whatsapp-401-recovery.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Harden durable WhatsApp 401 recovery"
          git push origin HEAD:fix/durable-whatsapp-401-recovery
