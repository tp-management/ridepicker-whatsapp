name: n8n production webhook acceptance probe
on:
  push:
    branches:
      - feature/raw-messages-n8n-outbox-v1-20261028
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: POST a harmless, marked test payload to n8n production webhook
        env:
          N8N_PROBE_URL: https://ridepicker.app.n8n.cloud/webhook/messages/process
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request, uuid
          message_id = "ridepicker-acceptance-probe-" + uuid.uuid4().hex
          payload = {
            "message_id": message_id,
            "user_id": "ridepicker-integration-test",
            "session_id": "ridepicker-integration-test",
            "chat_id": "ridepicker-integration-test",
            "chat_name": "RidePicker webhook test only",
            "sender_name": "RidePicker Integration Probe",
            "body": "[TEST ONLY] Webhook acceptance probe. No real WhatsApp job.",
            "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          req = urllib.request.Request(
            os.environ["N8N_PROBE_URL"],
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json", "X-RidePicker-Message-Id": message_id, "X-RidePicker-Test": "true"},
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=15) as r:
              status, body = r.status, r.read(600).decode("utf-8", errors="replace")
          except urllib.error.HTTPError as e:
            status, body = e.code, e.read(600).decode("utf-8", errors="replace")
          except Exception as e:
            print("WEBHOOK_PROBE_NETWORK_ERROR:", type(e).__name__, str(e))
            raise SystemExit(2)
          print("WEBHOOK_PROBE_HTTP_STATUS:", status)
          print("WEBHOOK_PROBE_RESPONSE:", body)
          print("WEBHOOK_PROBE_MESSAGE_ID:", message_id)
          if not 200 <= status < 300:
            raise SystemExit(1)
          PY
