name: Apply WhatsApp logout status fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale WhatsApp status precedence
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/whatsapp.js")
          s = p.read_text()
          old = '  let status = memorySession?.status || dbSession?.status || "DISCONNECTED";'
          new = '''  const dbStatus = dbSession?.status || null;
          const terminalDbStatus = new Set(["LOGGED_OUT", "DISCONNECTED"]);

          // Supabase is authoritative for terminal connection states. A stale
          // in-memory Baileys session must never make a logged-out device look
          // connected in the frontend.
          let status =
            dbStatus && terminalDbStatus.has(dbStatus)
              ? dbStatus
              : memorySession?.status || dbStatus || "DISCONNECTED";'''

          if old not in s:
              raise SystemExit("Expected status line was not found; no change made.")

          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/whatsapp.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: trust DB logout state over stale WhatsApp memory state"
          git push origin HEAD:main
