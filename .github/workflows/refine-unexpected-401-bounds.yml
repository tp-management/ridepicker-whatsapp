name: Refine unexpected 401 recovery bounds

on:
  push:
    branches:
      - fix/preserve-auth-on-unexpected-401

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-auth-on-unexpected-401
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply refinement
        run: node scripts/refine-unexpected-401-bounds.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Commit verified refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/whatsapp.js test/whatsappCharacterization.test.js
          git diff --cached --check
          git commit -m "Keep unexpected 401 recovery bounded across transient opens"
          git push origin HEAD:fix/preserve-auth-on-unexpected-401
