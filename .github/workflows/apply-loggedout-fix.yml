name: Apply WhatsApp logged-out state fix

on:
  push:
    branches:
      - fix/whatsapp-loggedout-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-loggedout-cleanup
          fetch-depth: 1
      - name: Patch terminal WhatsApp status normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/whatsapp.js')
          s = p.read_text()
          old = '''  let status = memorySession?.status || dbSession?.status || "DISCONNECTED";\n\n  // While automatic pairing is active, QR is only an internal readiness\n'''
          new = '''  // Supabase is the authoritative source for terminal connection state.\n  // The in-memory Baileys session can remain around briefly after a remote\n  // Linked Device removal, so never let stale runtime state resurrect a\n  // CONNECTED UI after the database has recorded LOGGED_OUT/DISCONNECTED.\n  const dbStatus = dbSession?.status || null;\n  const terminalDbStatus = new Set(["LOGGED_OUT", "DISCONNECTED"]);\n  let status =\n    dbStatus && terminalDbStatus.has(dbStatus)\n      ? dbStatus\n      : memorySession?.status || dbStatus || "DISCONNECTED";\n\n  // While automatic pairing is active, QR is only an internal readiness\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/whatsapp.js
          git diff --cached --quiet || git commit -m "fix: honor logged-out WhatsApp DB state"
          git push
