name: Apply unexpected 401 safety fix

on:
  push:
    branches:
      - fix/preserve-auth-on-unexpected-401

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/preserve-auth-on-unexpected-401
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded source patch
        run: node scripts/apply-unexpected-401-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/whatsapp.js src/whatsapp/managedSessionBoundary.js test/whatsappCharacterization.test.js test/managedSessionBoundary.test.js
          git diff --cached --check
          git commit -m "Protect registered WhatsApp auth from unsolicited 401 conflicts"
          git push origin HEAD:fix/preserve-auth-on-unexpected-401
